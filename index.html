<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>দারুন নাজাত আইডিয়াল মাদ্রাসা — ফলাফল</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-label="মাদ্রাসার লোগো">DN</div>
    <div><div class="school-name" id="schoolName">দারুন নাজাত</div><div class="school-sub">আইডিয়াল মাদ্রাসা</div></div>
  </div>
  <button class="menu-btn" id="menuBtn" aria-label="মেনু">⋮</button>
</header>
<div class="menu" id="menu">
  <button data-view="personal">ব্যক্তিগত ফলাফল</button>
  <button data-view="classwise">ক্লাস ওয়ারী ফলাফল</button>
</div>

<main>
  <section class="hero">
    <div class="eyebrow">RESULT</div>
    <h1 id="pageTitle">ফলাফল অনুসন্ধান</h1>
    <p id="pageHint">নিচের তথ্যগুলো নির্বাচন করে ফলাফল খুঁজুন।</p>
  </section>

  <section class="card" id="personalView">
    <label>সাল</label>
    <select id="year"><option>২০২৬</option></select>
    <label>পরীক্ষা</label>
    <select id="exam"><option>দ্বিতীয় সাময়িক পরীক্ষা</option><option>প্রথম সাময়িক পরীক্ষা</option><option>বার্ষিক পরীক্ষা</option></select>
    <label>শ্রেণি</label>
    <select id="classSelect"></select>
    <label>রোল নম্বর</label>
    <input id="roll" inputmode="numeric" placeholder="যেমন: ১ অথবা 1">
    <button class="primary" id="searchBtn">ফলাফল খুঁজুন</button>
  </section>

  <section class="card hidden" id="classView">
    <label>সাল</label>
    <select id="classYear"><option>২০২৬</option></select>
    <label>পরীক্ষা</label>
    <select id="classExam"><option>দ্বিতীয় সাময়িক পরীক্ষা</option><option>প্রথম সাময়িক পরীক্ষা</option><option>বার্ষিক পরীক্ষা</option></select>
    <label>শ্রেণি</label>
    <select id="classSelect2"></select>
    <button class="primary" id="classSearchBtn">ক্লাসের ফলাফল দেখুন</button>
  </section>

  <section id="result"></section>
</main>

<footer>
  <div class="about-title">ABOUT</div>
  <h2 id="footerSchool">দারুন নাজাত আইডিয়াল মাদ্রাসা</h2>
  <p>শিক্ষার্থীদের ফলাফল সহজ ও দ্রুত অনলাইনে দেখার জন্য এই সেবা।</p>
  <div class="copyright">© ২০২৬ দারুন নাজাত আইডিয়াল মাদ্রাসা</div>
</footer>
<script src="script.js"></script>
</body>
</html>
